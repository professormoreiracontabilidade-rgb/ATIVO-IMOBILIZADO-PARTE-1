<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativo Imobilizado — Parte 1 | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#133b68;font:18px/1.6 system-ui,Arial}main{max-width:720px;margin:auto;padding:20px 18px 110px}h1{font-size:clamp(30px,7vw,46px);line-height:1.2}h2{font-size:27px;line-height:1.3}button,input,a.btn{font:inherit;border-radius:13px;padding:14px 16px}button,a.btn{cursor:pointer;background:#133b68;color:white;border:0;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:default}input{width:100%;border:1px solid #acc4d8;background:white;color:#133b68;margin:6px 0 12px}label{display:block;font-weight:650}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #143b6810;margin:16px 0}.tag{color:#007f87;font-size:13px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.btn{width:100%;text-align:center;margin:7px 0}.green{background:#007f87!important}.note{background:#e8f5f3;border-radius:14px;padding:18px}.text{white-space:pre-line}.meta{font-size:14px;color:#50657c}header{display:flex;justify-content:space-between;gap:10px;align-items:center}progress{width:100%;height:9px;accent-color:#007f87}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cfdeeb;padding:12px;display:flex;justify-content:center;gap:10px;z-index:5}nav button{min-width:65px}.option{display:block;width:100%;text-align:left;margin:10px 0;background:#f0f6fb;color:#133b68;border:2px solid transparent}.option.selected{border-color:#007f87;background:#e8f5f3}.correct{background:#d9f3e5;color:#14623a}.wrong{background:#ffe0e0;color:#9c2634}.feedback{padding:15px;border-radius:12px;font-weight:bold}.error{color:#b92b36;font-size:15px}footer{font-size:13px;text-align:center;margin-top:25px}a{color:#007f87}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #eaa12b;outline-offset:3px}</style></head><body><main id="app"></main><nav id="nav" hidden></nav><script>
const QUESTIONS=[{"n": 1, "header": "FGV - AJ TRT24/TRT 24/Administrativa/Contabilidade/2025", "body": "Uma sociedade empresária do setor de engenharia tem uma biblioteca, que é utilizada por seus empregados para obter informações técnicas. \n \n\nOs livros da biblioteca são classificados no balanço patrimonial da sociedade empresária como", "options": [{"letter": "A", "text": "ativo intangível."}, {"letter": "B", "text": "Investimentos."}, {"letter": "C", "text": "ativo Imobilizado."}, {"letter": "D", "text": "ativo circulante."}, {"letter": "E", "text": "ativo realizável a longo prazo."}], "answer": "C", "resolution": "Os livros são bens físicos utilizados para apoiar o trabalho por mais de um período.\nClassificação: imobilizado, alternativa C. A informação contida nos livros não\ntransforma os exemplares físicos em ativos intangíveis."}, {"n": 2, "header": "FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2025", "body": "Uma concessionária oferecia serviços de aluguel e de venda de carros. As receitas obtidas com cada tipo de serviço correspondiam à metade do faturamento da concessionária.\n \n\nEm 31/12/2024, os carros destinados à venda, com expectativa de negociação no curto prazo, tinham valor contábil de R$ 300.000,00, enquanto os carros destinados ao aluguel tinham valor contábil de R$ 200.000,00.\n \n\nA apresentação dos carros no balanço patrimonial da concessionária em 31/12/2024 é:", "options": [{"letter": "A", "text": "ativo circulante: R$ 500.000,00."}, {"letter": "B", "text": "ativo imobilizado: R$ 500.000,00."}, {"letter": "C", "text": "ativo circulante: R$ 300.000,00; investimentos: R$ 200.000,00."}, {"letter": "D", "text": "ativo imobilizado: R$ 300.000,00; investimentos: R$ 200.000,00."}, {"letter": "E", "text": "ativo circulante: R$ 300.000,00; ativo imobilizado: R$ 200.000,00."}], "answer": "E", "resolution": "Carros para venda no curto prazo: estoque/ativo circulante R$ 300.000. Carros para\naluguel: imobilizado R$ 200.000. A participação de cada atividade no faturamento não\naltera a finalidade de cada grupo. Alternativa E."}, {"n": 3, "header": "FGV - Ana Leg (ALEAM)/ALEAM/Contador/2025", "body": "Uma empresa de auditoria obteve um financiamento de uma empresa imobiliária, para a compra de um imóvel, que será utilizado em sua prestação de serviços a terceiros. No Balanço Patrimonial da empresa de auditoria, o aumento no passivo teve como contrapartida um aumento no", "options": [{"letter": "A", "text": "investimento."}, {"letter": "B", "text": "ativo circulante."}, {"letter": "C", "text": "ativo imobilizado."}, {"letter": "D", "text": "patrimônio líquido."}, {"letter": "E", "text": "ativo realizável a longo prazo."}], "answer": "C", "resolution": "O imóvel será utilizado pela própria empresa em suas atividades. O financiamento\naumenta o passivo e a aquisição aumenta o imobilizado. Alternativa C. Não é\npropriedade para investimento apenas porque a atividade presta serviços a terceiros."}, {"n": 4, "header": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "body": "No balanço patrimonial, os ativos não circulantes são classificados como realizável a longo prazo, investimentos, imobilizado e intangível.\n \n\nAssinale a opção que indica uma diferença específica entre direitos classificados como ativo imobilizado e intangível.", "options": [{"letter": "A", "text": "Os imobilizados têm vida útil definida enquanto os intangíveis, vida útil indefinida."}, {"letter": "B", "text": "Os imobilizados são passíveis de depreciação enquanto os intangíveis, de exaustão."}, {"letter": "C", "text": "Os imobilizados tem por objeto bens corpóreos enquanto os intangíveis, bens incorpóreos."}, {"letter": "D", "text": "Os imobilizados são destinados à manutenção da entidade enquanto os intangíveis, não são."}, {"letter": "E", "text": "Os imobilizados podem ser reduzidos por perda de recuperabilidade, enquanto os intangíveis, não podem."}], "answer": "C", "resolution": "A diferença específica cobrada é a natureza física: imobilizado corresponde a bens\ncorpóreos; intangível, a bens sem substância física. Alternativa C. Ambos podem ter\nvida útil definida e perda de recuperabilidade; intangível com vida definida é\namortizado, não exaurido apenas por ser intangível."}, {"n": 5, "header": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "body": "Uma sociedade empresária, que trabalha com consultoria contábil, apresenta os seguintes ativos:\n\n    Disponibilidades: R$20.000;\n    Computadores usados na atividade fim: R$35.000;\n    Aluguel antecipado de sala comercial usada para a atividade fim: R$48.000;\n    Veículo mantido para venda: R$70.000;\n    Imóvel destinado a aluguel a terceiros: R$85.000.\n\n \n\nAssinale a opção que indica o ativo imobilizado da sociedade empresária.", "options": [{"letter": "A", "text": "R$35.000."}, {"letter": "B", "text": "R$83.000."}, {"letter": "C", "text": "R$105.000."}, {"letter": "D", "text": "R$155.000."}, {"letter": "E", "text": "R$190.000."}], "answer": "A", "resolution": "Imobilizado = computadores usados na atividade, R$ 35.000. Disponibilidades têm\nclasse própria; aluguel antecipado é serviço a consumir; veículo para venda exige\nclasse própria; imóvel alugado é propriedade para investimento. Alternativa A."}, {"n": 6, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "body": "Uma joalheria apresenta, em seu Balanço Patrimonial, três imóveis. O primeiro, onde são realizadas as vendas da loja, é avaliado por R$900.000. O segundo, avaliado por R$700.000, é alugado a terceiros. Já o terceiro, que funciona como escritório e onde acontecem as atividades administrativas, é avaliado por R$500.000.\n\n\nConsiderando apenas esses fatos, assinale a opção que indica o saldo do ativo imobilizado da joalheria.", "options": [{"letter": "A", "text": "R$500.000."}, {"letter": "B", "text": "R$900.000."}, {"letter": "C", "text": "R$1.400.000."}, {"letter": "D", "text": "R$2.100.000."}], "answer": "C", "resolution": "Loja R$ 900.000 + escritório administrativo R$ 500.000 = R$ 1.400.000 em\nimobilizado. Imóvel alugado a terceiros, R$ 700.000, é propriedade para investimento\nno cenário. Alternativa C."}, {"n": 7, "header": "FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024", "body": "Um hospital localizado no Centro da cidade adquiriu um terreno ao lado de seu prédio para a construção de um estacionamento para ser utilizado, exclusivamente, pelos pacientes, de modo a oferecer melhor atendimento. No Balanço Patrimonial do hospital, o terreno deve ser classificado como", "options": [{"letter": "A", "text": "Ativo Imobilizado."}, {"letter": "B", "text": "Ativo Realizável a Longo Prazo."}, {"letter": "C", "text": "Propriedade para investimento."}, {"letter": "D", "text": "Ativo não circulante mantido para a venda."}], "answer": "A", "resolution": "O terreno serve à operação do hospital e ao atendimento dos pacientes. Classificação:\nativo imobilizado, alternativa A. Não é imóvel adquirido para obter renda autônoma\nnem mantido para venda."}, {"n": 8, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "body": "Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril.\n \n\nNo Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de", "options": [{"letter": "A", "text": "janeiro."}, {"letter": "B", "text": "fevereiro."}, {"letter": "C", "text": "março."}, {"letter": "D", "text": "abril."}], "answer": "C", "resolution": "Assinatura em janeiro e pagamento em fevereiro não significam recebimento da\nmáquina. No cenário, ela foi entregue, instalada e disponibilizada em março.\nReconhecimento no imobilizado em março: alternativa C. O uso voluntariamente\nadiado até abril não altera essa referência."}],THEORY=[{"title": "1. A finalidade do bem orienta a classificação", "text": "Pergunte primeiro: para que a entidade mantém esse bem? O mesmo tipo de objeto pode receber classificações diferentes conforme seu uso.", "tag": "IDEIA PRINCIPAL"}, {"title": "Computador usado no escritório", "text": "Imobilizado: apoia as atividades administrativas.", "tag": "USO ADMINISTRATIVO"}, {"title": "Veículo utilizado em entregas", "text": "Imobilizado: presta serviços à operação.", "tag": "USO OPERACIONAL"}, {"title": "Veículo comprado para revenda", "text": "Estoque: integra a atividade de venda.", "tag": "VENDA"}, {"title": "Imóvel utilizado pela própria entidade", "text": "Imobilizado: uso operacional ou administrativo.", "tag": "USO PRÓPRIO"}, {"title": "Imóvel para obter aluguéis ou valorização", "text": "Propriedade para investimento: examinar CPC 28.", "tag": "RENDA OU VALORIZAÇÃO"}, {"title": "Software independente", "text": "Intangível: examinar CPC 04.", "tag": "SEM SUBSTÂNCIA FÍSICA"}, {"title": "Software indispensável à máquina", "text": "Integra o equipamento, quando é parte inseparável de seu funcionamento.", "tag": "PARTE DO EQUIPAMENTO"}, {"title": "Atenção ao aluguel a terceiros", "text": "Carros e equipamentos alugados podem ser imobilizado; imóveis para renda normalmente entram no CPC 28.", "tag": "PARA REVISAR"}],KEY='moreira-cpc27-parte1-v1';let state={name:'',unlocked:false,index:0,answers:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let chosen=null;
const app=document.getElementById('app'),nav=document.getElementById('nav');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function wa(text){return 'https://wa.me/5561985323574?text='+encodeURIComponent(text)}
function cover(){nav.hidden=true;nav.style.display='none';app.innerHTML=`<div class="tag">CPC 27 • ESTUDO E TREINAMENTO</div><h1>Ativo Imobilizado<br>Parte 1</h1><h2>Professor Moreira</h2><div class="note">A finalidade do bem orienta a classificação.<br>Teoria + questões 1 a 8.</div><section class="card"><label for="name">Nome do aluno</label><input id="name" autocomplete="name" value="${esc(state.name)}" placeholder="Digite seu nome"><button class="btn green" id="request">📲 Enviar mensagem ao Professor</button><p class="meta">Você pode enviar uma mensagem ao Professor Moreira pelo botão acima. Informe seu nome e toque em acessar para começar.</p><button class="btn" id="enter">Acessar o material</button><div id="error" class="error" role="alert"></div></section><footer>Curso de Contabilidade Professor Moreira<br>Quem quer ser aprovado estuda.</footer>`;document.getElementById('request').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n){document.getElementById('error').textContent='Informe seu nome para solicitar acesso.';return}state.name=n;save();window.open(wa('Olá, Professor Moreira! Sou '+n+'. Vou estudar o HTML Ativo Imobilizado — Parte 1.'),'_blank','noopener')};document.getElementById('enter').onclick=()=>{let n=document.getElementById('name').value.trim();if(!n){document.getElementById('error').textContent='Informe seu nome.';return}state.name=n;state.unlocked=true;save();render()}}
const total=THEORY.length+QUESTIONS.length*2+1;function render(){if(!state.unlocked){cover();return}state.index=Math.max(0,Math.min(total-1,state.index));chosen=null;nav.hidden=false;nav.style.display='flex';let i=state.index;app.innerHTML=`<header><span class="tag">Professor Moreira • Parte 1</span><span class="meta">${i+1}/${total}</span></header><progress max="${total}" value="${i+1}"></progress>`;let canNext=true;if(i<THEORY.length){let t=THEORY[i];app.innerHTML+=`<section class="card"><span class="tag">${esc(t.tag)}</span><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p></section>`}else if(i<total-1){let off=i-THEORY.length,q=QUESTIONS[Math.floor(off/2)],a=state.answers[q.n];if(off%2===0){canNext=!!a;app.innerHTML+=`<section class="card"><span class="tag">TREINAMENTO</span><h2>Questão ${q.n}</h2><p class="meta">${esc(q.header)}</p><div class="text">${esc(q.body)}</div><div id="opts">${q.options.map(o=>`<button class="option ${a&&a.choice===o.letter?'selected':''}" data-choice="${o.letter}" aria-pressed="${!!(a&&a.choice===o.letter)}" ${a?'disabled':''}><b>${o.letter})</b> ${esc(o.text)}</button>`).join('')}</div>${a?'<p class="note">Resposta registrada. Avance para ver a resolução.</p>':'<button class="btn green" id="confirm" disabled>Confirmar resposta</button>'}</section>`;if(!a){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});document.getElementById('confirm').disabled=false});document.getElementById('confirm').onclick=()=>{if(!chosen)return;state.answers[q.n]={choice:chosen,correct:chosen===q.answer};state.index++;save();render();window.scrollTo(0,0)}}}else{app.innerHTML+=`<section class="card"><span class="tag">CONFERÊNCIA</span><h2>Resolução ${q.n}</h2>${a?`<div class="feedback ${a.correct?'correct':'wrong'}" role="status">${a.correct?'✅ Você acertou!':'❌ Você errou.'} Sua resposta: ${a.choice}.</div>`:''}<p class="note"><b>Gabarito: ${q.answer}</b></p><div class="text">${esc(q.resolution)}</div></section>`}}else{let answered=Object.keys(state.answers).length,right=Object.values(state.answers).filter(a=>a.correct).length;app.innerHTML+=`<section class="card"><span class="tag">TREINAMENTO CONCLUÍDO</span><h2>Resultado de ${esc(state.name)}</h2><p>Respondidas: <b>${answered}/8</b><br>Acertos: <b>${right}/8</b></p><a class="btn green" target="_blank" rel="noopener" href="${wa('Professor Moreira, sou '+state.name+'. Resultado em Ativo Imobilizado — Parte 1: '+right+' acertos em 8 questões.')}" >📲 Enviar resultado ao Professor</a><button class="btn" id="again">Refazer o treinamento</button></section>`;document.getElementById('again').onclick=()=>{if(confirm('Apagar suas respostas e reiniciar?')){state.answers={};state.index=0;save();render()}}}nav.innerHTML=`<button id="back" ${i===0?'disabled':''} aria-label="Voltar">←</button><button id="home">Capa</button><button id="next" ${i===total-1||!canNext?'disabled':''} aria-label="Avançar">→</button>`;document.getElementById('back').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('home').onclick=cover;save()}
function go(delta){state.index+=delta;save();render();window.scrollTo(0,0)}render();
</script></body></html>
